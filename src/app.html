<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#F5F0E6" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#16140F" media="(prefers-color-scheme: dark)" />
		<meta name="format-detection" content="telephone=no" />
		<meta name="color-scheme" content="light dark" />
		<meta name="mobile-web-app-capable" content="yes" />
		<link rel="manifest" href="/manifest.json" />
		<link rel="sitemap" type="application/xml" href="/sitemap.xml" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;700;800&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Vollkorn:ital,wght@0,400;0,600;0,700;1,400&display=swap"
		/>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
