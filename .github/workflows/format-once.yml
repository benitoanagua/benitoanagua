name: One-time FOLIO formatting

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Format package validation changes
        run: |
          pnpm exec prettier --write \
            package.json \
            scripts/validate-folio-pack.mjs \
            .github/workflows/ci.yml \
            docs/design/folio-quality-roadmap.md \
            .github/workflows/format-once.yml
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json scripts/validate-folio-pack.mjs .github/workflows/ci.yml docs/design/folio-quality-roadmap.md
          git commit -m "style: format FOLIO package validation"
          git push origin main
