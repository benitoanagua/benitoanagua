name: One-time FOLIO formatting

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Format changed FOLIO files
        run: |
          pnpm exec prettier --write \
            apps/catalog/src/App.svelte \
            e2e/catalog/accessibility.spec.ts \
            e2e/catalog/sections.spec.ts \
            packages/folio/COMPONENTS.md \
            packages/folio/README.md \
            packages/folio/src/lib/styles/utilities.css \
            PROJECT.md \
            README.md \
            .github/workflows/format-once.yml
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/catalog/src/App.svelte e2e/catalog/accessibility.spec.ts e2e/catalog/sections.spec.ts packages/folio/COMPONENTS.md packages/folio/README.md packages/folio/src/lib/styles/utilities.css PROJECT.md README.md
          git commit -m "style: format FOLIO quality updates"
          git push origin main
