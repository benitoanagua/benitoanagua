name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Format admin UI files for formatter review
        run: pnpm exec prettier --write src/lib/components/admin src/routes/admin
      - name: Upload formatted admin UI files
        uses: actions/upload-artifact@v4
        with:
          name: admin-folio-formatted-sources
          path: |
            src/lib/components/admin/
            src/routes/admin/
      - name: Prepare local D1 (migrations + seeds)
        run: pnpm d1:migrations:local
      - name: Static checks
        run: |
          pnpm check:all
          pnpm lint
          pnpm test
          pnpm check:content
          pnpm check:design
          pnpm build
          pnpm folio:build
          pnpm folio:pack:check
          pnpm folio:consumer:check
          pnpm catalog:build

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E suite
        run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
