name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Format documentation for diagnostics
        run: |
          pnpm exec prettier --write docs/operations/cloudflare-wrangler.md docs/README.md
          for file in docs/operations/cloudflare-wrangler.md docs/README.md; do
            echo "FORMATTED_FILE:$file"
            base64 -w0 "$file"
            echo
          done
      - name: Static checks
        run: |
          pnpm check
          pnpm lint
          pnpm check:content
          pnpm check:design
          pnpm build
          pnpm folio:build
          pnpm catalog:build
