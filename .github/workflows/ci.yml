name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Format admin UI files for formatter review
        run: pnpm exec prettier --write src/lib/components/admin src/routes/admin
      - name: Commit formatted admin UI files to this PR branch
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/admin-folio-components'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/components/admin src/routes/admin
          if ! git diff --cached --quiet; then
            git commit -m 'style(admin): format FOLIO dashboard files'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Prepare local D1 (migrations + seeds)
        run: pnpm d1:migrations:local
      - name: Static checks
        run: |
          pnpm check:all
          pnpm lint
          pnpm test
          pnpm check:content
          pnpm check:design
          pnpm build
          pnpm folio:build
          pnpm folio:pack:check
          pnpm folio:consumer:check
          pnpm catalog:build

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E suite
        run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
