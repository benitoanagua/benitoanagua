# Wrangler Pages config: Production DB and local DB_PREVIEW administration.
# The deployed Preview DB binding is configured in Cloudflare Pages deployment settings.
name = "benitoanagua"
pages_build_output_dir = ".svelte-kit/cloudflare"
compatibility_date = "2026-11-24"
compatibility_flags = ["nodejs_als"]

# Runtime env vars for the /admin Cloudflare Access + JWT check. These values
# are not secrets (the AUD tag and team domain appear in Access JWTs anyway).
# Declaring them here keeps `wrangler pages deploy` from wiping the Pages
# deployment-config env vars on every deploy.
[vars]
ACCESS_TEAM_DOMAIN = "benitoanagua.cloudflareaccess.com"
ACCESS_AUD = "3fa8cdf9dba2484112c269a2b3cf8edcc1a0997038d34bf94e10e81110b9f838"
ADMIN_EMAIL = "benito.anagua@gmail.com"

# Production: binding DB apunta exclusivamente a la D1 de producción.
[[d1_databases]]
binding = "DB"
database_name = "benitoanagua-portfolio"
database_id = "e40020ce-adfb-4c14-b223-0a7b5e3de1b1"
migrations_dir = "migrations"

# Aislamiento Preview / Production:
# - Production (desplegado): binding DB -> D1 de producción
#     benitoanagua-portfolio (e40020ce-adfb-4c14-b223-0a7b5e3de1b1).
# - Preview (desplegado): binding DB -> D1 dedicada de Preview
#     benitoanagua-portfolio-preview (e35162cf-6599-4b2e-b1f9-ae4099382a4b).
#   Configurar en el dashboard de Cloudflare Pages (projecto benitoanagua ->
#   Settings -> Bases de datos D1, entorno Preview).
# wrangler.toml declara los bindings del desarrollo local: DB apunta a la D1
# con nombre de produccion y DB_PREVIEW a la de Preview. Un nombre de binding
# mapea a un solo recurso dentro de un conjunto de bindings, por eso la segunda
# base necesita un nombre distinto. Los bindings desplegados por entorno
# (Preview/Production) se gestionan en la configuracion del proyecto Pages en
# el dashboard de Cloudflare, no en este archivo.
#
# Para operaciones de administración local sobre la D1 de Preview (migraciones,
# consultas) se declara DB_PREVIEW con nombre de binding distinto.
[[d1_databases]]
binding = "DB_PREVIEW"
database_name = "benitoanagua-portfolio-preview"
database_id = "e35162cf-6599-4b2e-b1f9-ae4099382a4b"
migrations_dir = "migrations"
