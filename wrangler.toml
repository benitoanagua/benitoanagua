# Cloudflare is managed through Wrangler. Keep this file as the single
# source of truth for Pages output, D1 bindings, environments and migrations.
name = "benitoanagua"
pages_build_output_dir = ".svelte-kit/cloudflare"
compatibility_date = "2026-11-24"
compatibility_flags = ["nodejs_als"]

# Shared D1 database. Both Pages environments intentionally bind the same
# database; use separate databases only if preview data must be isolated.
[[d1_databases]]
binding = "DB"
database_name = "benitoanagua-portfolio"
database_id = "e40020ce-adfb-4c14-b223-0a7b5e3de1b1"
migrations_dir = "migrations"

[env.production]
name = "benitoanagua"
pages_build_output_dir = ".svelte-kit/cloudflare"

[[env.production.d1_databases]]
binding = "DB"
database_name = "benitoanagua-portfolio"
database_id = "e40020ce-adfb-4c14-b223-0a7b5e3de1b1"
migrations_dir = "migrations"

[env.preview]
name = "benitoanagua-preview"
pages_build_output_dir = ".svelte-kit/cloudflare"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "benitoanagua-portfolio"
database_id = "e40020ce-adfb-4c14-b223-0a7b5e3de1b1"
migrations_dir = "migrations"
