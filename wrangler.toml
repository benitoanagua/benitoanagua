# Cloudflare Pages configuration. Wrangler is the source of truth.
name = "benitoanagua"
pages_build_output_dir = ".svelte-kit/cloudflare"
compatibility_date = "2026-11-24"
compatibility_flags = ["nodejs_als"]

# TEMPORARY: Preview and Production share this D1 database.
# Treat Preview as production data; do not test admin writes or destructive operations here.
# Configure an isolated Preview D1 binding in the Cloudflare Pages dashboard before enabling writes.
[[d1_databases]]
binding = "DB"
database_name = "benitoanagua-portfolio"
database_id = "e40020ce-adfb-4c14-b223-0a7b5e3de1b1"
migrations_dir = "migrations"
