# Cloudflare Pages configuration. Wrangler is the source of truth.
name = "benitoanagua"
pages_build_output_dir = ".svelte-kit/cloudflare"
compatibility_date = "2026-11-24"
compatibility_flags = ["nodejs_als"]

# Production: binding DB apunta exclusivamente a la D1 de producción.
[[d1_databases]]
binding = "DB"
database_name = "benitoanagua-portfolio"
database_id = "e40020ce-adfb-4c14-b223-0a7b5e3de1b1"
migrations_dir = "migrations"

# Preview: binding DB apunta a una D1 independiente de Preview para aislar datos de Production.
# Usar con `wrangler pages dev --env preview`. El binding desplegado en el entorno Preview de
# Cloudflare Pages debe configurarse en el dashboard (o API) de Pages apuntando a esta misma D1.
[env.preview]
[[d1_databases]]
binding = "DB"
database_name = "benitoanagua-portfolio-preview"
database_id = "e35162cf-6599-4b2e-b1f9-ae4099382a4b"
migrations_dir = "migrations"
