name = "benitoanagua"
pages_build_output_dir = ".svelte-kit/cloudflare"
compatibility_date = "2026-02-19"
compatibility_flags = ["nodejs_als"]

# D1 binding for portfolio content. `database_id` was created with
# `wrangler d1 create benitoanagua-portfolio` (region ENAM).
[[d1_databases]]
binding = "DB"
database_name = "benitoanagua-portfolio"
database_id = "e40020ce-adfb-4c14-b223-0a7b5e3de1b1"
migrations_dir = "migrations"

[env.production]
name = "benitoanagua-production"
